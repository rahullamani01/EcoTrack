    <script>
      // In AI Studio iFrame preview environments, HMR WebSockets are intentionally disabled.
      // Intercept and swallow benign WebSocket disconnection warnings from @vite/client.
      window.addEventListener('unhandledrejection', function (event) {
        if (event.reason && (
          event.reason.message?.includes('WebSocket closed') ||
          event.reason.message?.includes('vite:ws') ||
          String(event.reason).includes('WebSocket')
        )) {
          event.preventDefault();
        }
      });
    </script>
